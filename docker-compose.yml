services:
  relai-team:
    build: .
    image: relai-team:dev
    restart: unless-stopped
    # Run as the user that owns the repos: bd (Beads) writes lock files even to read, and a root
    # container would leave root-owned files in them. Defaults to the first host user (1000).
    user: "${RELAI_TEAM_UID:-1000}:${RELAI_TEAM_GID:-1000}"
    environment:
      HOME: /tmp
    # Tokens (GitHub / GitLab) for private repos and for issue mirrors. They never go in config.json: it
    # only names the environment variable (token_env), and this file provides it.
    #   cp config/secrets.env.example config/secrets.env     then fill in the lines you need
    # Optional: the file does not have to exist. It is git-ignored: keep it that way.
    env_file:
      - path: ./config/secrets.env
        required: false
    # Alternative without a file: pass a variable from your shell through, e.g.
    #   GITHUB_ISSUES_TOKEN=github_pat_... docker compose up -d
    # after listing it here (a name without a value is taken from the shell that runs compose):
    # (add it under `environment:` as `GITHUB_ISSUES_TOKEN:` with no value.)
    ports:
      - "${RELAI_TEAM_PORT:-8080}:8080"
    volumes:
      # config.json: listen, repos, members (see README). Read-only.
      - ./config:/config:ro
      # Event log (events.jsonl): claims survive restarts. Set data_dir to /data in config.json.
      - ./data:/data
      # Repos declared by local path in config.json must be visible at the same path in the container.
      # Writable on purpose: bd (Beads) needs to write lock files in .beads/ even for a read.
      - ${RELAI_TEAM_REPOS:-./repos}:/repos
